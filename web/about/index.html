<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About | India H2 Workforce Atlas</title>
  <meta name="description" content="The advisory circle and contact details for the India H2 Workforce Atlas, an Ekavikalp project.">
  <meta property="og:title" content="About — India H2 Workforce Atlas">
  <meta property="og:description" content="Advisory circle and contact for the India H2 Workforce Atlas.">
  <meta property="og:type" content="article">
  <meta property="og:url" content="https://hygoat.in/workforce-atlas/about/">
  <link rel="stylesheet" href="../style.css">
  <style>
    /* Page-specific layout. Single column document, no hero. */
    .about-page {
      max-width: 720px;
      margin: 0 auto;
      padding: var(--space-8) var(--space-6);
    }
    .about-page h1 {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.3;
      margin: 0 0 var(--space-6) 0;
    }
    .about-page h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: var(--space-8) 0 var(--space-3) 0;
    }
    .about-page p {
      font-size: 1rem;
      line-height: 1.6;
      margin: 0 0 var(--space-4) 0;
    }
    .about-page a {
      color: var(--color-hy);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .about-page a:hover { color: var(--color-hy-dark); }
    .about-page a:focus-visible {
      outline: 2px solid #3b82f6;
      outline-offset: 2px;
      border-radius: 2px;
    }

    /* Advisory circle: flat single-column list. No photos, no initials-in-circle. */
    .advisor-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .advisor-list li {
      padding: var(--space-4) 0;
      border-bottom: 1px solid var(--border);
    }
    .advisor-list li:last-child { border-bottom: 0; }
    .advisor-name {
      display: block;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
    }
    .advisor-affiliation {
      display: block;
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--text-muted);
      margin-bottom: var(--space-2);
    }
    .advisor-role {
      display: block;
      font-size: 0.95rem;
      color: var(--text);
      line-height: 1.5;
    }

    /* Empty state: declarative paragraph, occupies same vertical rhythm as one
       advisor entry. NOT an empty <ul>, NOT a placeholder badge, NOT "coming soon". */
    .advisor-empty {
      padding: var(--space-4) 0;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text);
      margin: 0;
    }

    @media (max-width: 768px) {
      .about-page {
        padding: var(--space-5) var(--space-4);
      }
      .about-page h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <!-- #include nav -->

  <main class="about-page">
    <h1>About</h1>

    <h2>Contact</h2>
    <p>Questions, corrections, or collaboration: <a href="mailto:ekansh@ekavikalp.com">ekansh@ekavikalp.com</a>.</p>
  </main>

  <!-- #include footer -->
</body>
</html>
